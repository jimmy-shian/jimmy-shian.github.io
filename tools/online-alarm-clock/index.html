<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上鬧鐘 - 工具庫</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../components/global.css">
    <link rel="stylesheet" href="../../components/navigation.css">
    <link rel="stylesheet" href="../../components/footer.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="../../components/navigation.js"></script>

    <main>
        <header class="tool-header">
            <div class="header-badge">ALARM CLOCK</div>
            <h1>線上鬧鐘</h1>
            <p>高精度數位時鐘與自訂鬧鐘提醒，支援快捷時間疊加與多組鬧鐘記錄。</p>
        </header>

        <div class="alarm-container card">
            <div class="time-display">
                <div class="current-time">
                    <span class="display-label">當前時間</span>
                    <div id="current-time-display" class="time">00:00:00</div>
                </div>
                
                <div class="alarm-time">
                    <span class="display-label">設定鬧鐘時間</span>
                    <div id="alarm-time-display" class="time">未設定</div>
                </div>
            </div>

            <div class="alarm-controls">
                <div class="time-inputs">
                    <div class="input-group">
                        <label for="hour">時 (0-23)</label>
                        <input type="number" id="hour" min="0" max="23" placeholder="00" value="">
                    </div>
                    <div class="input-group">
                        <label for="minute">分 (0-59)</label>
                        <input type="number" id="minute" min="0" max="59" placeholder="00" value="">
                    </div>
                    <div class="input-group">
                        <label for="second">秒 (0-59)</label>
                        <input type="number" id="second" min="0" max="59" placeholder="00" value="">
                    </div>
                </div>

                <div class="quick-buttons">
                    <button class="quick-add btn" data-type="hour">+1 小時</button>
                    <button class="quick-add btn" data-type="minute">+10 分鐘</button>
                    <button class="quick-add btn" data-type="second">+30 秒</button>
                </div>

                <div class="action-buttons">
                    <button id="set-alarm" class="btn primary" style="min-width: 140px;">設定鬧鐘</button>
                    <button id="stop-alarm" class="btn" disabled style="min-width: 140px;">停止鬧鐘</button>
                </div>
            </div>

            <div class="alarm-list" id="alarm-list">
                <h3>已設定的鬧鐘清單</h3>
                <div id="alarms-container" class="alarms-container">
                    <div class="empty-message">尚未設定任何鬧鐘</div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../../components/footer.js"></script>
</body>
</html>
