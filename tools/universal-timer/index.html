<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用計時器 - 工具庫</title>
    <link rel="stylesheet" href="../../components/global.css">
    <link rel="stylesheet" href="../../components/navigation.css">
    <link rel="stylesheet" href="../../components/footer.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="../../components/navigation.js"></script>

    <main>
        <header class="tool-header">
            <div class="header-badge">TIME CONTROL</div>
            <h1>通用計時器</h1>
            <p>整合高精度毫秒秒錶、自訂計時器與倒數計時，支援圈數記錄與一鍵複製。</p>
        </header>

        <div class="timer-switcher">
            <button class="timer-mode active" data-mode="stopwatch">秒錶 (Stopwatch)</button>
            <button class="timer-mode" data-mode="timer-mode">計時器 (Timer)</button>
            <button class="timer-mode" data-mode="countdown">倒數計時 (Countdown)</button>
        </div>

        <div class="timer-container card">
            <!-- 秒錶模式 -->
            <div class="timer-section stopwatch-section active">
                <div class="timer-display" id="stopwatch-display">00:00:00.000</div>
                <div class="timer-controls">
                    <button id="start-stopwatch" class="btn primary">開始</button>
                    <button id="pause-stopwatch" class="btn" disabled>暫停</button>
                    <button id="lap-stopwatch" class="btn" disabled>記錄圈數</button>
                    <button id="reset-stopwatch" class="btn" disabled>重設</button>
                </div>
                <div class="laps-container">
                    <h3>圈數記錄</h3>
                    <div id="laps-list" class="laps-list">
                        <!-- 圈數記錄動態添加 -->
                    </div>
                </div>
            </div>

            <!-- 計時器模式 -->
            <div class="timer-section timer-mode-section">
                <div class="timer-display" id="timer-display">00:00:00</div>
                <div class="timer-controls">
                    <button id="start-timer" class="btn primary">開始</button>
                    <button id="pause-timer" class="btn" disabled>暫停</button>
                    <button id="reset-timer" class="btn" disabled>重設</button>
                </div>
            </div>

            <!-- 倒數計時模式 -->
            <div class="timer-section countdown-section">
                <div class="timer-display" id="countdown-display">00:00:00</div>
                <div class="timer-controls">
                    <div class="time-inputs">
                        <div class="input-group">
                            <label for="hours">小時</label>
                            <input type="number" id="hours" min="0" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label for="minutes">分鐘</label>
                            <input type="number" id="minutes" min="0" max="59" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label for="seconds">秒數</label>
                            <input type="number" id="seconds" min="0" max="59" placeholder="0">
                        </div>
                    </div>
                    <div class="quick-add-buttons">
                        <button class="quick-add btn" data-type="hour">+1 小時</button>
                        <button class="quick-add btn" data-type="minute">+10 分鐘</button>
                        <button class="quick-add btn" data-type="second">+30 秒</button>
                    </div>
                    <div class="timer-buttons">
                        <button id="start-countdown" class="btn primary">開始倒數</button>
                        <button id="pause-countdown" class="btn" disabled>暫停</button>
                        <button id="reset-countdown" class="btn" disabled>重設</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="../../components/footer.js"></script>
</body>
</html>
