<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整塔羅牌抽牌占卜 - 工具庫</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../components/global.css">
    <link rel="stylesheet" href="../../components/navigation.css">
    <link rel="stylesheet" href="../../components/footer.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="../../components/navigation.js"></script>

    <main>
        <header class="tool-header">
            <div class="header-badge">SINGLE DRAW</div>
            <h1>完整塔羅占卜</h1>
            <p>隨機抽取單張塔羅牌，獲取直覺啟發。支援 78 張完整牌組與大阿爾克那抽牌篩選。</p>
        </header>

        <div class="single-draw-container">
            <div class="controls-card card">
                <div class="options-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="major-only">
                        <span>僅抽取大阿爾克那 (Major Arcana)</span>
                    </label>
                </div>
                <button id="generate-card" class="btn primary" style="width: 100%; margin-top: 12px;">抽取單張塔羅牌</button>
            </div>

            <div id="card-container" style="display: none;">
                <div class="tarot-card">
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">
                            <div class="card-image"></div>
                            <div class="card-title"></div>
                            <div class="card-meaning"></div>
                        </div>
                    </div>
                </div>
                <div id="ai-text" class="card"></div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    <script src="../../components/footer.js"></script>
</body>
</html>
