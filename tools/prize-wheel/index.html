<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輪盤抽獎工具 - 工具庫</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../components/global.css">
    <link rel="stylesheet" href="../../components/navigation.css">
    <link rel="stylesheet" href="../../components/footer.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast-container"></div>
    <script src="../../components/navigation.js"></script>

    <main>
        <header class="tool-header">
            <div class="header-badge">LUCKY DRAW</div>
            <h1>輪盤抽獎工具</h1>
            <p>自訂獎項、數量與參與者名單，支援多色系切換與公平旋轉抽獎。</p>
        </header>

        <div class="wheel-app-grid">
            <div class="setup-section card">
                <div class="input-group">
                    <h3>獎項設置</h3>
                    <div class="color-scheme">
                        <h4>色系風格</h4>
                        <div class="color-options">
                            <label class="color-option">
                                <input type="radio" name="color-scheme" value="default" checked>
                                <span class="color-preview" style="background: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 100%);"></span>
                                <span>暖色系</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-scheme" value="cool">
                                <span class="color-preview" style="background: linear-gradient(135deg, #A1C4FD 0%, #C2E9FB 100%);"></span>
                                <span>冷色系</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-scheme" value="pastel">
                                <span class="color-preview" style="background: linear-gradient(135deg, #D4FC79 0%, #96E6A1 100%);"></span>
                                <span>粉彩系</span>
                            </label>
                        </div>
                    </div>
                    <div id="prize-inputs">
                        <div class="prize-header">
                            <span class="prize-name-header">獎項名稱</span>
                            <span class="prize-quantity-header">數量</span>
                            <span class="prize-actions-header">操作</span>
                        </div>
                        <div class="prize-item">
                            <input type="text" placeholder="例如：頭獎" class="prize-name" value="" onchange="resetDraw()" >
                            <input type="number" placeholder="1" min="1" value="1" class="prize-quantity" onchange="resetDraw()">
                            <button class="remove-prize btn">刪除</button>
                        </div>
                    </div>
                    <button id="add-prize" class="btn" style="margin-top: 10px;">+ 新增獎項</button>
                </div>

                <div class="input-group" style="margin-top: 20px;">
                    <h3>參與者名單</h3>
                    <div class="input-option">
                        <label>
                            <input type="radio" name="participant-type" value="auto" checked>
                            自動產生序號
                        </label>
                        <label>
                            <input type="radio" name="participant-type" value="manual">
                            手動輸入名單
                        </label>
                    </div>
                    
                    <div id="manual-participants">
                        <textarea id="participants" placeholder="每行輸入一位參與者姓名"></textarea>
                    </div>
                    
                    <div id="auto-participants" style="display: none;">
                        <div class="auto-options">
                            <div>
                                <label for="start-number">起始編號</label>
                                <input type="number" id="start-number" min="1" value="1" class="small-input">
                            </div>
                            <div>
                                <label for="participant-count">人數數量</label>
                                <input type="number" id="participant-count" min="1" value="10" class="small-input">
                            </div>
                            <div>
                                <label for="prefix">前綴字（選填）</label>
                                <input type="text" id="prefix" placeholder="例如：員工" class="small-input">
                            </div>
                        </div>
                    </div>
                </div>

                <div style="margin: 14px 0;">
                    <label style="font-weight: normal; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                        <input type="checkbox" id="allow-repeat-winner">
                        <span>允許重複中獎</span>
                    </label>
                </div>

                <div class="draw-actions">
                    <button id="start-draw" class="btn primary" style="flex: 2;">開始抽獎</button>
                    <button id="reset-draw" class="btn" style="flex: 1;">重設</button>
                </div>
            </div>

            <div class="wheel-stage card">
                <div class="wheel-container">
                    <canvas id="wheel"></canvas>
                    <div class="wheel-center"></div>
                    <div class="pointer"></div>
                </div>

                <div id="result" class="result-section">
                    <h3>中獎結果</h3>
                    <div id="winners"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    <script src="../../components/footer.js"></script>
</body>
</html>
